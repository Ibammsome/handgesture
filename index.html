<!DOCTYPE html>
<html>
<head>
<title>Website Aku</title>

<style>

/* BACKGROUND */
body {
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    font-family: Arial, sans-serif;
    text-align: center;
    color: white;
    height: 100vh;
}

/* FOTO PROFILE */
    img {
    width: 200px;
    height: 200px;
    object-fit: cover;
    border-radius: 50%;   /* bikin bulat */
    margin-top: 20px;

    border: 4px solid cyan;
    box-shadow: 0 0 50px cyan;
    transition: 0.5s;
}

img:hover {
    transform: scale(1.2);
    box-shadow: 0 0 80px cyan;
}

/* NAMA ANIMASI */
h2 {
    margin-top: 50px;
    animation: muncul 2s ease;
    
}

@keyframes muncul {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* BUTTON KEREN */
button {
    background: linear-gradient(45deg, cyan, blue);
    color: white;
    border: none;
    padding: 12px 25px; 
    font-size: 16px;
    border-radius: 25px;
    cursor: pointer;
    margin-top: 20px;
    box-shadow: 0 0 15px cyan;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.2);
    box-shadow: 0 0 80px cyan;
}

button:active {
    transform: scale(0.95);
}

</style>
</head>

<body>

<img src="Desain tanpa judul - Copy.png">

<h2>Halo, Aku Ibrahim 👋</h2>

<p>Ini website pertama aku pakai VS Code 🚀</p>

<a href="tentang.html">
    <button>Klik Aku</button>
</a>
